name: retatrutide-cn-weekly-report

on:
  schedule:
    # 每周三 18:30（北京时间）= 10:30（UTC）
    - cron: "30 10 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the report, do not send DingTalk message"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run monitor
        env:
          # 不要把 webhook/token 写进仓库，请在仓库 Settings → Secrets and variables → Actions 里添加
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node ./src/index.js

  # GitHub 会在仓库连续 60 天无活动后自动停用定时任务（disabled_inactivity）。
  # 每次运行时通过 API 重新启用本工作流，以重置该计时器，无需产生提交。
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weekly-report.yml/enable"
