name: retatrutide-cn-weekly-report

on:
  schedule:
    # 每周三 18:30（北京时间）= 10:30（UTC）
    - cron: "30 10 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run monitor
        env:
          # 不要把 webhook/token 写进仓库，请在仓库 Settings → Secrets and variables → Actions 里添加
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: node ./src/index.js
