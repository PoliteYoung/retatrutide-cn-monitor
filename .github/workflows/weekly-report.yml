name: retatrutide-cn-weekly-report

on:
  schedule:
    # 每周三 18:30（北京时间）= 10:30（UTC）
    - cron: "30 10 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the report, do not send DingTalk message"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run monitor
        env:
          # 不要把 webhook/token 写进仓库，请在仓库 Settings → Secrets and variables → Actions 里添加
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          WPUSHER_WEBHOOK_URL: ${{ secrets.WPUSHER_WEBHOOK_URL }}
          WPUSHER_AUTHORIZATION: ${{ secrets.WPUSHER_AUTHORIZATION }}
          DINGTALK_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node ./src/index.js
